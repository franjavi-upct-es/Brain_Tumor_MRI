# configs/config.yaml — Root Hydra configuration for brain tumor classifcation v2
# Composes data, model, training, and experiment configs via Hydra defeaults.

defeaults:
  - data: brats2023
  - model: densenet121_2d
  - training: baseline
  - _self_

# Global settings
seed: 42
project_name: "brain_tumor_classification_v2"
debug: false

# Paths (relative to project root)
paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  splits: "data/splits"
  outputs: "outputs"
  models: "outputs/models"
  metrics: "outputs/metrics"
  evaluation: "outputs/evaluation"
  figures: "outputs/figures"
  logs: "outputs/logs"

# Cross-validation settings
cross_validation:
  n_splits: 5
  shuffle: True

# Wandb experiment tracking
wandb:
  project: "brain-tumor-v2"
  entity: null # Set to your W&B username or team
  mode: "online" # "online", "offline", or "disabled"
  tags: ["v2", "rigorous"]
