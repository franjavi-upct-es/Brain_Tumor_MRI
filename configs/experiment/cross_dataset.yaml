# configs/experiment/cross_dataset.yaml — Cross-dataset validation experiment
# Answers: "Does the model generalize across institutions?"
# Train on multi-institutional BraTS, validate on single-institution UCSF-PDGM.
# Expected: 3-8 percentage point drop, which is normal and expected.

experiment:
  name: "cross_dataset_validation"
  description: "Evaluate generalization by training on BraTS and testing on UCSF-PDGM"

  # Training dataset
  train_dataset: "brats2023"
  train_split: "stratified_group_kfold"
  n_folds: 5

  # External validation dataset — never seen during training
  eval_dataset: "ucsf_pdgm"

  # Models to evaluate cross-dataset
  models: ["densenet121_2d", "resnet50_2d", "efficientnet_2d"]

  # Metrics with 95% CI via patient-level bootstrap
  metrics:
    primary: ["balanced_accuracy", "f1_macro", "auc_roc", "cohens_kappa"]
    secondary: ["sensitivity_per_class", "specificity_per_class", "pr_auc"]
    calibration: ["ece", "brier_score"]

  bootstrap:
    n_iterations: 1000
    confidence_level: 0.95
    patient_level: true

  # Statistical tests
  statistical_tests:
    - name: "delong"
      description: "Compare AUCs between BraTS internal and UCSF-PDGM external"
    - name: "mcnemar"
      description: "Compare error rates internal vs external"
